# Optional profile: run the same JPA entities against MySQL instead of H2.
#   SPRING_PROFILES_ACTIVE=mysql DB_URL=jdbc:mysql://localhost:3306/webscorer \
#   DB_USERNAME=webscorer DB_PASSWORD=secret mvn spring-boot:run
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/webscorer?useSSL=false&serverTimezone=UTC&characterEncoding=utf8}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:webscorer}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.h2.console.enabled=false

# Requires the MySQL driver on the classpath - add:
#   <dependency><groupId>com.mysql</groupId><artifactId>mysql-connector-j</artifactId><scope>runtime</scope></dependency>
