spring.application.name=webscorer-ai

server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------------------
# Database - H2 file database keeps history across restarts with zero setup.
# To move to MySQL later: use the "mysql" Spring profile (application-mysql.properties)
# and set the DB_* environment variables. The JPA entities are identical.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/webscorer;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Handy while developing; the API does not depend on the console.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------------
# Scanner limits (timeouts, redirects, response size)
# ---------------------------------------------------------------------------
webscorer.scan.connect-timeout-ms=5000
webscorer.scan.read-timeout-ms=10000
webscorer.scan.max-redirects=3
webscorer.scan.max-bytes=1048576
webscorer.scan.user-agent=WebScorerAI/1.0 (+https://localhost; website audit)

# Extra origins for the Vite dev server. Any http://localhost:* / http://127.0.0.1:*
# port is always allowed (Vite auto-increments to 5174+ when 5173 is taken and its
# proxy forwards the browser's Origin header); other origins get a JSON 403.
webscorer.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ---------------------------------------------------------------------------
# AI copilot (optional). Never put a real key in this file - use environment
# variables, see .env.example at the repository root.
# When api-key is empty the backend answers in clearly-labelled local mode.
# ---------------------------------------------------------------------------
webscorer.ai.api-key=${WEBSCORER_AI_API_KEY:}
webscorer.ai.base-url=${WEBSCORER_AI_BASE_URL:https://api.openai.com/v1}
webscorer.ai.model=${WEBSCORER_AI_MODEL:gpt-4o-mini}
webscorer.ai.timeout-ms=${WEBSCORER_AI_TIMEOUT_MS:20000}
