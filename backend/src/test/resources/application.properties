# Test profile - this file replaces the main application.properties on the
# test classpath, so every placeholder the app needs must exist here too.
spring.datasource.url=jdbc:h2:mem:webscorer-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false

webscorer.scan.connect-timeout-ms=2000
webscorer.scan.read-timeout-ms=3000
webscorer.scan.max-redirects=3
webscorer.scan.max-bytes=1048576
webscorer.scan.user-agent=WebScorerAI-test/1.0
webscorer.cors.allowed-origins=http://localhost:5173
webscorer.ai.api-key=
webscorer.ai.base-url=https://api.openai.com/v1
webscorer.ai.model=test-model
webscorer.ai.timeout-ms=1000
